<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1B3800" />
  <title>Demo Travel Umrah</title>

  <link rel="icon" type="image/png" href="./assets/images/icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" />

  <style>
    /* ---------- Tokens ---------- */
    :root {
      --bg: #F5F4EE;
      --forest: #1B3800;
      --green: #365C19;
      --ink-soft: #4B5645;
      --muted: #5A6654;
      --border: #E4E8DC;
      --tint: #F0F3EB;
      --tint-border: #E2E9DC;

      --font-main: 'DM Sans', system-ui, sans-serif;
      --font-heading: 'Manrope', 'DM Sans', system-ui, sans-serif;

      --radius-card: 24px;
      --radius-tile: 14px;
      --gutter: clamp(20px, 7vw, 96px);
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--forest);
      font-family: var(--font-main);
      overflow-x: clip;
    }
    a:focus-visible { outline: 2px solid var(--green); outline-offset: 4px; border-radius: 8px; }

    .background-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .18;
      pointer-events: none;
      z-index: -1;
    }
    .glow-one { background: #B4C99C; top: -200px; left: -150px; }
    .glow-two { background: #C7D9B6; bottom: -200px; right: -150px; }

    /* ---------- Page layout: header / main / footer ---------- */
    .page {
      max-width: 1440px;
      min-height: 100svh;
      margin: 0 auto;
      padding: 28px var(--gutter) 24px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 24px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--forest); text-decoration: none; }
    .brand-icon { width: 38px; height: 38px; object-fit: contain; }
    .brand-name { font-family: var(--font-heading); font-weight: 800; font-size: 22px; letter-spacing: -.04em; }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: #E8EFE1;
      border: 1px solid #D5E1CB;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #638C45;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(99, 140, 69, .12);
      animation: statusPulse 2s infinite;
    }

    main { display: grid; place-items: center; text-align: center; }
    .hero { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; }

    /* ---------- Illustration ---------- */
    .scene { width: min(100%, 860px); aspect-ratio: 900 / 370; }
    .scene svg { display: block; width: 100%; height: 100%; overflow: visible; }

    .cloud { animation: cloudDrift 14s ease-in-out infinite alternate; }
    .cloud-two { animation-duration: 18s; animation-delay: -5s; }
    .mountain-back { animation: mountainBreath 8s ease-in-out infinite; }
    .mountain-front { animation: mountainBreath 10s ease-in-out infinite reverse; }

    .worker-left, .worker-right, .worker-center { transform-origin: 50% 90%; animation: workerBounce 3.5s ease-in-out infinite; }
    .worker-right { animation-duration: 4s; animation-delay: -.8s; }
    .worker-center { animation-duration: 3.2s; animation-delay: -1.4s; }

    .toolbox { transform-origin: center bottom; animation: toolboxWiggle 5s ease-in-out infinite; }
    .floating-leaf { transform-origin: center; animation: leafFloat 5s ease-in-out infinite; }
    .spark { animation: sparkPulse 2.5s ease-in-out infinite; }

    /* ---------- Copy ---------- */
    .content { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .content > * { animation: fadeUp .8s both; }
    .content > :nth-child(2) { animation-delay: .12s; }
    .content > :nth-child(3) { animation-delay: .24s; }
    .content > :nth-child(4) { animation-delay: .36s; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--green);
      font-size: 14px;
      font-weight: 600;
    }
    .eyebrow svg { width: 16px; height: 16px; }

    h1 {
      font-family: var(--font-heading);
      font-size: clamp(38px, 8vw, 80px);
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -.055em;
      text-wrap: balance;
    }
    h1 span { display: block; color: var(--green); }

    .description {
      max-width: 46ch;
      margin-top: 20px;
      color: var(--ink-soft);
      font-size: clamp(15px, 2vw, 16px);
      line-height: 1.75;
      text-wrap: balance;
    }

    /* ---------- Launch card ---------- */
    .launch-card {
      width: min(100%, 500px);
      margin-top: 32px;
      padding: 24px;
      background: rgba(255, 255, 255, .78);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: 0 12px 35px rgba(27, 56, 0, .05);
    }
    .launch-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    .launch-heading svg { width: 16px; height: 16px; color: var(--green); }
    .launch-date { margin-top: 8px; color: var(--green); font-size: 15px; font-weight: 600; }

    .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; }
    .countdown-item {
      padding: 14px 6px;
      background: var(--tint);
      border: 1px solid var(--tint-border);
      border-radius: var(--radius-tile);
    }
    .countdown-number {
      font-family: var(--font-heading);
      font-size: clamp(24px, 5vw, 30px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.03em;
      font-variant-numeric: tabular-nums;
    }
    .countdown-label { margin-top: 8px; color: var(--muted); font-size: 12px; font-weight: 600; }

    /* ---------- Footer ---------- */
    footer { display: flex; align-items: center; justify-content: center; gap: 16px; color: var(--muted); font-size: 13px; }
    .footer-line { width: 48px; height: 1px; background: #D7DFD3; }
    .footer-logo { width: 20px; height: 20px; flex-shrink: 0; object-fit: contain; }

    /* ---------- Keyframes ---------- */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes workerBounce { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(-1deg); } }
    @keyframes cloudDrift { from { transform: translateX(-8px); } to { transform: translateX(18px); } }
    @keyframes mountainBreath { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes toolboxWiggle { 0%, 90%, 100% { transform: rotate(0); } 93% { transform: rotate(-3deg); } 96% { transform: rotate(3deg); } }
    @keyframes leafFloat { 0%, 100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(5deg) translateY(-6px); } }
    @keyframes sparkPulse { 0%, 100% { opacity: .45; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes statusPulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

    /* ---------- Responsive ---------- */
    @media (max-width: 640px) {
      .page { padding-top: 22px; gap: 20px; }
      .brand-icon { width: 32px; height: 32px; }
      .brand-name { font-size: 19px; }
      .status { padding: 8px 12px; font-size: 12px; }
      .hero { gap: 12px; }
      .launch-card { margin-top: 28px; padding: 20px 14px; }
      .countdown { gap: 8px; }
      footer { gap: 12px; font-size: 12px; }
      .footer-line { width: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

  <script>
    const CONFIG = {
      brandName: "PANGRANGOWEB",
      deployDate: "2026-11-25T09:00:00+07:00",
      locale: "id-ID",
      timezone: "Asia/Jakarta"
    };

    const $ = (id) => document.getElementById(id);
    const pad = (n) => String(n).padStart(2, "0");
    const targetDate = new Date(CONFIG.deployDate);

    $("brandName").textContent = CONFIG.brandName;
    $("footerText").textContent = `© ${new Date().getFullYear()} ${CONFIG.brandName}. All rights reserved.`;

    const dateFormatter = new Intl.DateTimeFormat(CONFIG.locale, {
      weekday: "long", day: "numeric", month: "long", year: "numeric",
      hour: "2-digit", minute: "2-digit", timeZone: CONFIG.timezone
    });
    $("launchDate").textContent = dateFormatter.format(targetDate) + " WIB";

    const units = { days: $("days"), hours: $("hours"), minutes: $("minutes"), seconds: $("seconds") };

    // Returns true once the launch time has passed.
    function updateCountdown() {
      const distance = targetDate.getTime() - Date.now();

      if (distance <= 0) {
        Object.values(units).forEach((el) => (el.textContent = "00"));
        document.querySelector(".launch-heading span").textContent = "Deployment Time";
        $("launchDate").textContent = "We're ready to launch!";
        return true;
      }

      units.days.textContent = pad(Math.floor(distance / 86400000));
      units.hours.textContent = pad(Math.floor(distance / 3600000) % 24);
      units.minutes.textContent = pad(Math.floor(distance / 60000) % 60);
      units.seconds.textContent = pad(Math.floor(distance / 1000) % 60);
      return false;
    }

    if (!updateCountdown()) {
      const timer = setInterval(() => { if (updateCountdown()) clearInterval(timer); }, 1000);
    }
    document.addEventListener("visibilitychange", () => { if (!document.hidden) updateCountdown(); });
  </script>
</body>
