
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8f1" />

  <title>Under Construction — Something Good Is Coming</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #f7f8f1;
      --surface: #ffffff;
      --forest: #244c38;
      --green: #477653;
      --sage: #83a982;
      --light-sage: #dce9d7;
      --muted: #758276;
      --border: #e7ebe2;
      --yellow: #f2c86b;

      --font-main: 'DM Sans', sans-serif;
      --font-heading: 'Manrope', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--forest);
      font-family: var(--font-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =============================
       BACKGROUND
    ============================== */

    .background-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .18;
      pointer-events: none;
      z-index: -1;
    }

    .glow-one {
      background: #b4d1a6;
      top: -200px;
      left: -150px;
    }

    .glow-two {
      background: #c7d9b6;
      bottom: -200px;
      right: -150px;
    }

    /* =============================
       LAYOUT
    ============================== */

    .page {
      min-height: 100svh;
      max-width: 1440px;
      margin: auto;
      padding: 32px 7%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* =============================
       HEADER
    ============================== */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--forest);
    }

    .brand-icon {
      width: 38px;
      height: 38px;
    }

    .brand-name {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -1px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: #edf4e8;
      border: 1px solid #dce8d4;
      border-radius: 100px;
      color: var(--forest);
      font-size: 13px;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #5f9862;
      border-radius: 50%;
      animation: statusPulse 2s infinite;
      box-shadow: 0 0 0 4px #5f986215;
    }

    /* =============================
       MAIN
    ============================== */

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-top: 20px;
      text-align: center;
    }

    .hero {
      width: 100%;
      position: relative;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--green);
      font-weight: 700;
      margin-bottom: 10px;
      animation: fadeUp .7s both;
    }

    .eyebrow svg {
      width: 16px;
      height: 16px;
    }

    /* =============================
       STICKER SCENE
    ============================== */

    .scene {
      width: min(100%, 860px);
      height: 340px;
      margin: 0 auto;
      position: relative;
      isolation: isolate;
    }

    .scene svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .scene-element {
      transform-box: fill-box;
      transform-origin: center;
    }

    .cloud {
      animation: cloudDrift 14s ease-in-out infinite alternate;
    }

    .cloud-two {
      animation-duration: 18s;
      animation-delay: -5s;
    }

    .mountain-back {
      animation: mountainBreath 8s ease-in-out infinite;
    }

    .mountain-front {
      animation: mountainBreath 10s ease-in-out infinite reverse;
    }

    .worker-left {
      transform-origin: 50% 90%;
      animation: workerBounce 3.5s ease-in-out infinite;
    }

    .worker-right {
      transform-origin: 50% 90%;
      animation: workerBounce 4s ease-in-out infinite;
      animation-delay: -.8s;
    }

    .worker-center {
      transform-origin: 50% 90%;
      animation: workerBounce 3.2s ease-in-out infinite;
      animation-delay: -1.4s;
    }

    .toolbox {
      animation: toolboxWiggle 5s ease-in-out infinite;
      transform-origin: center bottom;
    }

    .floating-leaf {
      animation: leafFloat 5s ease-in-out infinite;
      transform-origin: center;
    }

    .floating-leaf:nth-child(2) {
      animation-delay: -2s;
    }

    .spark {
      animation: sparkPulse 2.5s ease-in-out infinite;
    }

    .spark:nth-child(2) {
      animation-delay: .7s;
    }

    /* =============================
       TEXT
    ============================== */

    .content {
      position: relative;
      z-index: 2;
      margin-top: -2px;
    }

    h1 {
      font-family: var(--font-heading);
      font-size: clamp(42px, 6.5vw, 84px);
      font-weight: 800;
      letter-spacing: -5px;
      line-height: 1.02;
      color: var(--forest);
      animation: fadeUp .8s .15s both;
    }

    h1 span {
      color: var(--green);
      display: block;
    }

    .description {
      margin: 20px auto 0;
      color: #738076;
      font-size: 16px;
      line-height: 1.8;
      max-width: 460px;
      animation: fadeUp .8s .3s both;
    }

    /* =============================
       DEPLOYMENT COUNTDOWN
    ============================== */

    .launch-card {
      margin: 34px auto 0;
      width: min(100%, 490px);
      background: rgba(255,255,255,.76);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px 24px;
      box-shadow: 0 12px 35px rgba(36,76,56,.04);
      animation: fadeUp .8s .45s both;
    }

    .launch-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.8px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .launch-heading svg {
      width: 16px;
      height: 16px;
      color: var(--green);
    }

    .launch-date {
      margin-top: 10px;
      font-size: 14px;
      color: var(--green);
      font-weight: 600;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    .countdown-item {
      width: 82px;
      padding: 14px 8px;
      border-radius: 14px;
      background: #f1f5ed;
      border: 1px solid #e6ece1;
    }

    .countdown-number {
      font-family: var(--font-heading);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      color: var(--forest);
      font-variant-numeric: tabular-nums;
    }

    .countdown-label {
      margin-top: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #8a9589;
    }

    /* =============================
       FOOTER
    ============================== */

    footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 36px;
      padding-bottom: 8px;
      color: #8c978c;
      font-size: 12px;
    }

    .footer-line {
      width: 50px;
      height: 1px;
      background: #d7dfd3;
    }

    .footer-logo {
      width: 20px;
      height: 20px;
    }

    /* =============================
       ANIMATIONS
    ============================== */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes workerBounce {
      0%, 100% {
        transform: translateY(0) rotate(0);
      }
      50% {
        transform: translateY(-6px) rotate(-1deg);
      }
    }

    @keyframes cloudDrift {
      0% {
        transform: translateX(-8px);
      }
      100% {
        transform: translateX(18px);
      }
    }

    @keyframes mountainBreath {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-3px);
      }
    }

    @keyframes toolboxWiggle {
      0%, 90%, 100% {
        transform: rotate(0);
      }
      93% {
        transform: rotate(-3deg);
      }
      96% {
        transform: rotate(3deg);
      }
    }

    @keyframes leafFloat {
      0%, 100% {
        transform: rotate(-3deg) translateY(0);
      }
      50% {
        transform: rotate(5deg) translateY(-6px);
      }
    }

    @keyframes sparkPulse {
      0%, 100% {
        opacity: .45;
        transform: scale(.85);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    @keyframes statusPulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: .45;
      }
    }

    /* =============================
       RESPONSIVE
    ============================== */

    @media (max-width: 768px) {
      .page {
        padding: 24px 22px;
      }

      .brand-name {
        font-size: 19px;
      }

      .brand-icon {
        width: 32px;
        height: 32px;
      }

      .status {
        font-size: 11px;
        padding: 9px 12px;
      }

      .scene {
        height: 260px;
      }

      h1 {
        font-size: clamp(44px, 11vw, 72px);
        letter-spacing: -3px;
      }

      .description {
        font-size: 14px;
      }

      .launch-card {
        padding: 20px 14px;
      }

      .countdown {
        gap: 8px;
      }

      .countdown-item {
        width: 68px;
        padding: 13px 6px;
      }

      .countdown-number {
        font-size: 25px;
      }

      footer {
        margin-top: 26px;
        font-size: 10px;
      }
    }

    @media (max-width: 420px) {
      .scene {
        height: 220px;
      }

      .status {
        gap: 7px;
        font-size: 10px;
      }

      .countdown-item {
        width: 62px;
      }

      .countdown-number {
        font-size: 23px;
      }

      .footer-line {
        width: 24px;
      }
    }

    /* =============================
       REDUCED MOTION
    ============================== */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

  <!-- JAVASCRIPT -->
  <script>
    /* ========================================
       CONFIGURATION
       Ubah konfigurasi website di sini
    ======================================== */

    const CONFIG = {
      brandName: "Summit.id",

      // Format ISO: YYYY-MM-DDTHH:mm:ss+07:00
      // Contoh: 15 Desember 2026 pukul 09.00 WIB
      deployDate: "2026-12-15T09:00:00+07:00",

      locale: "id-ID",
      timezone: "Asia/Jakarta"
    };


    /* ========================================
       BRAND SETUP
    ======================================== */

    document.getElementById("brandName").textContent =
      CONFIG.brandName;

    document.getElementById("year").textContent =
      new Date().getFullYear();

    document.getElementById("footerText").innerHTML =
      `© ${new Date().getFullYear()} ${CONFIG.brandName}. All rights reserved.`;


    /* ========================================
       DEPLOYMENT DATE FORMAT
    ======================================== */

    const targetDate = new Date(CONFIG.deployDate);

    const dateFormatter = new Intl.DateTimeFormat(CONFIG.locale, {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      timeZone: CONFIG.timezone
    });

    document.getElementById("launchDate").textContent =
      dateFormatter.format(targetDate) + " WIB";


    /* ========================================
       COUNTDOWN
    ======================================== */

    const countdownElements = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds")
    };

    function pad(number) {
      return String(number).padStart(2, "0");
    }

    function updateCountdown() {
      const now = Date.now();
      const distance = targetDate.getTime() - now;

      if (distance <= 0) {
        countdownElements.days.textContent = "00";
        countdownElements.hours.textContent = "00";
        countdownElements.minutes.textContent = "00";
        countdownElements.seconds.textContent = "00";

        document.querySelector(".launch-heading span").textContent =
          "Deployment Time";

        document.getElementById("launchDate").textContent =
          "We're ready to launch!";

        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor(
        (distance / (1000 * 60 * 60)) % 24
      );
      const minutes = Math.floor(
        (distance / (1000 * 60)) % 60
      );
      const seconds = Math.floor(
        (distance / 1000) % 60
      );

      countdownElements.days.textContent = pad(days);
      countdownElements.hours.textContent = pad(hours);
      countdownElements.minutes.textContent = pad(minutes);
      countdownElements.seconds.textContent = pad(seconds);
    }

    updateCountdown();

    const countdownInterval = setInterval(() => {
      updateCountdown();

      if (targetDate.getTime() <= Date.now()) {
        clearInterval(countdownInterval);
      }
    }, 1000);


    /* ========================================
       PAGE VISIBILITY OPTIMIZATION
    ======================================== */

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        updateCountdown();
      }
    });
  </script>
